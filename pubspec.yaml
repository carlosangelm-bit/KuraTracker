name: kuratracker
description: "KuraTracker - Plataforma EHR para cuidado avanzado de heridas cronicas (Kura+ / CuraMas)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado
  flutter_riverpod: ^2.6.1

  # Backend: Supabase (Postgres + Auth + Storage)
  supabase_flutter: ^2.8.0

  # Persistencia local / offline-first (JSON store multiplataforma;
  # evita complejidad de sqlite-wasm en Flutter Web para la demo).
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # Conectividad
  connectivity_plus: ^6.1.0

  # UI / gráficas / fuentes
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  flutter_svg: ^2.0.16
  intl: ^0.19.0

  # Imágenes
  image_picker: ^1.1.2
  image: ^4.3.0

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.4

  # CSV
  csv: ^6.0.0
  file_picker: ^8.1.4
  file_selector: ^1.0.3
  web: ^1.1.0

  # Utilidades
  uuid: ^4.5.1
  collection: ^1.19.0
  go_router: ^14.6.2

  # Tienda (Shopify Storefront API) + abrir checkout en pestaña nueva
  http: ^1.2.2
  url_launcher: ^6.3.1

  # Voz -> texto (dictado)
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/engine/kura_model_v2.json
    - assets/engine/kura_clinical_adjustments.json
    - assets/engine/prevention_rules.json
    - assets/engine/braden_scale.json
    - assets/engine/clinical/thresholds.json
    - assets/engine/clinical/archetypes.json
    - assets/data/cie10_heridas.json
    - assets/images/
    - assets/demo/
