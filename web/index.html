<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kuratracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>kuratracker</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Conversión HEIC/HEIF → JPEG en el navegador (heic2any, hospedado local
       para no depender de un CDN). Trae su propio decodificador HEIF, así que
       funciona donde el navegador no decodifica HEIC nativamente (Chrome,
       Android). Dart lo invoca vía window.convertHeicToJpeg (image_transcode_web). -->
  <script src="vendor/heic2any.min.js" defer></script>
  <script>
    window.convertHeicToJpeg = async function (blob, quality) {
      var out = await heic2any({
        blob: blob,
        toType: "image/jpeg",
        quality: (typeof quality === "number" && quality > 0) ? quality : 0.85,
      });
      // heic2any puede devolver un Blob o un arreglo (HEIC con varias imágenes).
      return Array.isArray(out) ? out[0] : out;
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
