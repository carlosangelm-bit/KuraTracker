name: Deploy (migraciones + build + Cloudflare Pages)

# Reemplaza el deploy manual (Genspark): en cada push a main aplica las
# migraciones pendientes a Supabase, compila la app con la versión de Flutter
# correcta (3.27.1) y publica prod y demo en Cloudflare Pages. También se puede
# disparar a mano (workflow_dispatch).
#
# ORDEN garantizado: primero migraciones, luego build+deploy (build_deploy
# depende de migrations). Si las migraciones fallan, NO se despliega la app
# (evita publicar una versión que espera columnas que aún no existen).
#
# REQUISITOS — Settings → Secrets and variables → Actions → New repository secret:
#   Supabase (migraciones):
#     SUPABASE_ACCESS_TOKEN   Personal Access Token (supabase.com/dashboard/account/tokens)
#     SUPABASE_PROJECT_REF    Ref del proyecto (Project Settings → General)
#     SUPABASE_DB_PASSWORD    Contraseña de la BD (Project Settings → Database)
#   Supabase (build de PROD — clave pública anon, embebida en el cliente por diseño):
#     SUPABASE_URL            URL del proyecto (https://<ref>.supabase.co)
#     SUPABASE_ANON_KEY       anon/publishable key (Project Settings → API)
#   Cloudflare (publicar Pages):
#     CLOUDFARE_API_TOKEN     Token con permiso "Cloudflare Pages: Edit"
#     CLOUDFARE_ACCOUNT_ID    Account ID (dashboard Cloudflare, barra lateral)
#     (NOTA: los secrets de Cloudflare se llaman "CLOUDFARE_*" —sin la L— en
#      GitHub; el workflow los referencia con ese nombre exacto a propósito.)
#
# SEGURIDAD: el job de migraciones usa el environment "production"; si defines
# "Required reviewers" en Settings → Environments → production, cada corrida
# pedirá aprobación manual antes de tocar la BD.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Concurrencia a nivel de JOB (no de workflow): `migrations` (supabase db push)
# y `deploy_functions` NUNCA se cancelan a media aplicación
# (cancel-in-progress: false) — un push interrumpido dejaría el esquema/funciones
# a medias sin aviso. Un `build_deploy` cancelado sí es inofensivo (se
# re-despliega en el siguiente push).
jobs:
  migrations:
    concurrency:
      group: db-migrations-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Fijado (no 'latest'): 'latest' resolvía dinámicamente y a veces tomaba
          # una beta o fallaba el lookup → deploy_functions flaky. 2.113.0 = última
          # estable al 2026-08-08. Subir a mano cuando haga falta.
          version: 2.113.0
      - name: Verificar secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Falta SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF"  || { echo "Falta SUPABASE_PROJECT_REF"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD"  || { echo "Falta SUPABASE_DB_PASSWORD"; exit 1; }
      - name: Link al proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Migraciones pendientes (informativo)
        run: supabase migration list --linked || true
      - name: Aplicar migraciones
        run: supabase db push

  # Deploy de Edge Functions en job SEPARADO que NO bloquea build_deploy: si
  # falla, la app igual se despliega y se itera aparte. Se usa --use-api (deploy
  # por Management API, sin bundling con Docker) porque el bundling local con
  # Docker resultó frágil. Deploy DIRIGIDO (no todas) para no
  # re-habilitar verify_jwt en funciones con --no-verify-jwt (webhook Acuity).
  deploy_functions:
    needs: migrations
    concurrency:
      group: deploy-functions-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Fijado (no 'latest'): 'latest' resolvía dinámicamente y a veces tomaba
          # una beta o fallaba el lookup → deploy_functions flaky. 2.113.0 = última
          # estable al 2026-08-08. Subir a mano cuando haga falta.
          version: 2.113.0
      - name: Deploy admin-create-user (--use-api)
        run: supabase functions deploy admin-create-user --use-api --project-ref "$SUPABASE_PROJECT_REF"
      # Acuity proxy: la app (web) lo invoca con JWT → verify_jwt por default.
      # NO usar --no-verify-jwt aquí (eso es solo para el webhook de Acuity).
      - name: Deploy acuity-proxy (--use-api)
        run: supabase functions deploy acuity-proxy --use-api --project-ref "$SUPABASE_PROJECT_REF"
      # Mercado Pago (SOLO terminal Point / presencial; el pago en línea lo hace
      # Stripe). webhook SIN verify_jwt (MP no manda JWT; valida firma propia).
      - name: Deploy mercadopago-webhook (--use-api, --no-verify-jwt)
        run: supabase functions deploy mercadopago-webhook --use-api --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy mercadopago-sync-charge (--use-api)
        run: supabase functions deploy mercadopago-sync-charge --use-api --project-ref "$SUPABASE_PROJECT_REF"
      # Point intent: la app la invoca con JWT (push a la terminal física).
      - name: Deploy mercadopago-point-intent (--use-api)
        run: supabase functions deploy mercadopago-point-intent --use-api --project-ref "$SUPABASE_PROJECT_REF"
      # Stripe: create-checkout con verify_jwt (la app la invoca con JWT);
      # webhook SIN verify_jwt (Stripe no manda JWT; valida su firma propia).
      - name: Deploy stripe-create-checkout (--use-api)
        run: supabase functions deploy stripe-create-checkout --use-api --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy stripe-webhook (--use-api, --no-verify-jwt)
        run: supabase functions deploy stripe-webhook --use-api --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy vac-bot (--use-api)
        run: supabase functions deploy vac-bot --use-api --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy support-bot (--use-api)
        run: supabase functions deploy support-bot --use-api --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy shopify-sync-catalog (--use-api)
        run: supabase functions deploy shopify-sync-catalog --use-api --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy shopify-inventory (--use-api)
        run: supabase functions deploy shopify-inventory --use-api --project-ref "$SUPABASE_PROJECT_REF"

  build_deploy:
    needs: migrations
    concurrency:
      group: build-deploy-main
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # Mismo environment que el job de migraciones: así este job también puede
    # leer los secrets scoped al environment "production" (SUPABASE_URL/ANON_KEY,
    # CLOUDFLARE_*), no solo los de repositorio.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
      - run: flutter --version

      - name: Verificar secrets de build/deploy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
        run: |
          test -n "$SUPABASE_URL"          || { echo "Falta SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_ANON_KEY"     || { echo "Falta SUPABASE_ANON_KEY"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN"  || { echo "Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - run: flutter pub get

      # Guardia contra el bug del `$` escapado en strings de Dart: `\$var` NO
      # interpola (es un signo de pesos literal). Ya ocurrió 4 veces (perdía
      # fotos del borrador, rompía rutas y mensajes de error). Excluye los `\$`
      # legítimos de GraphQL en shopify_service.dart. Ver auditoría 28-ago-2026.
      - name: Guardia contra interpolaciones con dolar escapado
        run: |
          hits=$(grep -rnE '\\\$[a-zA-Z_{]' lib/ | grep -v 'shopify_service.dart' || true)
          if [ -n "$hits" ]; then
            echo "Interpolacion con dolar escapado (no interpola). Quita la barra invertida:"
            echo "$hits"
            exit 1
          fi
          echo "OK: sin dolares escapados en interpolaciones."

      # ---------- PROD (con credenciales reales de Supabase) ----------
      - name: Build web (prod)
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=SHOPIFY_STOREFRONT_TOKEN="${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}"

      - name: Deploy prod → kuratracker-prod
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=kuratracker-prod --branch=main --commit-dirty=true

      # ---------- DEMO (sin credenciales → modo local/sintético) ----------
      # flutter clean garantiza que los const String.fromEnvironment se
      # recompilen SIN los dart-define (si no, el caché podría reusar el bundle
      # de prod y la demo quedaría apuntando a Supabase real).
      - name: Build web (demo)
        run: |
          flutter clean
          flutter pub get
          flutter build web --release \
            --dart-define=SHOPIFY_STOREFRONT_TOKEN="${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}"

      - name: Deploy demo → kuratracker-demo
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=kuratracker-demo --branch=main --commit-dirty=true
