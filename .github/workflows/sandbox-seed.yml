name: Sandbox · seed de datos

# Siembra (o RE-siembra desde cero) los datos sintéticos del SANDBOX:
#   1. supabase/seed/seed_sandbox.sql        → centros de prueba, 7 cuentas,
#                                              catálogo, hospital, cuidadores.
#   2. supabase/seed/seed_synthetic_patients.sql → los 6 pacientes clínicos
#                                              validados contra el motor.
# Es idempotente: se puede correr las veces que haga falta para "resetear" los
# datos del sandbox después de una sesión de pruebas.
#
# Corre ÚNICAMENTE contra el environment "staging" y se niega si la cadena de
# conexión contiene el ref del proyecto de producción.
#
# SECRETS (Settings → Environments → staging):
#   SUPABASE_PROJECT_REF    Ref del proyecto sandbox. Ya existe: es el mismo que
#                           usa `supabase db push` en deploy.yml.
#   SUPABASE_DB_PASSWORD    Contraseña de la BD del sandbox. SOLO la contraseña,
#                           NO una cadena de conexión completa. Ya existe.
#   SANDBOX_USER_PASSWORD   Contraseña de las 7 cuentas de prueba (≥ 8 chars).
#
# Ya NO hace falta SUPABASE_DB_URL: el workflow arma la cadena del Session
# pooler solo (ver el paso "Armar cadena de conexión"). Ese secreto era la pieza
# más frágil de todo el flujo — obligaba a elegir a mano entre las tres cadenas
# que ofrece Supabase (la de Direct connection resuelve por IPv6 y los runners
# de GitHub son IPv4, así que falla con "Network is unreachable") y a
# percent-encodear la contraseña. Si lo tienes guardado, ya puedes borrarlo.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe SANDBOX para confirmar que quieres re-sembrar el entorno de pruebas'
        required: true
        type: string

concurrency:
  group: sandbox-seed
  cancel-in-progress: false

env:
  PROD_PROJECT_REF: mhnhgnzajdjhllypdutr
  # Host del Session pooler del sandbox. Es IPv4 (los runners de GitHub no
  # tienen IPv6). Depende de la REGIÓN del proyecto: si algún día se mueve el
  # sandbox de us-west-2, este valor cambia — sale de Supabase → Connect →
  # Direct/Connection string → Session pooler → Connection parameters → host.
  POOLER_HOST: aws-0-us-west-2.pooler.supabase.com

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: staging
    env:
      SANDBOX_USER_PASSWORD: ${{ secrets.SANDBOX_USER_PASSWORD }}
    steps:
      - name: Confirmación
        run: |
          [ "${{ inputs.confirm }}" = "SANDBOX" ] || { echo "::error::Escribe SANDBOX en el campo de confirmación."; exit 1; }

      - uses: actions/checkout@v4

      # Arma la cadena del Session pooler a partir de PROJECT_REF + DB_PASSWORD.
      # El host del pooler es determinista y el percent-encoding lo hace python,
      # asi que no hay forma de "copiar la cadena equivocada".
      - name: Armar cadena de conexión
        env:
          KT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          KT_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$KT_REF"                || { echo "::error::Falta SUPABASE_PROJECT_REF en el environment staging"; exit 1; }
          test -n "$KT_DB_PASSWORD"        || { echo "::error::Falta SUPABASE_DB_PASSWORD en el environment staging"; exit 1; }
          test -n "$SANDBOX_USER_PASSWORD" || { echo "::error::Falta SANDBOX_USER_PASSWORD en el environment staging"; exit 1; }
          [ "${#SANDBOX_USER_PASSWORD}" -ge 8 ] || { echo "::error::SANDBOX_USER_PASSWORD debe tener al menos 8 caracteres"; exit 1; }
          # Error clasico: pegar la cadena de conexion entera en el secreto de la
          # contraseña. Romperia tambien `supabase db push` en deploy.yml, asi
          # que conviene cacharlo aqui y decirlo con todas sus letras.
          case "$KT_DB_PASSWORD" in
            *://*|postgresql:*|postgres:*)
              echo "::error::SUPABASE_DB_PASSWORD contiene una cadena de conexión, no una contraseña. Debe ser SOLO la contraseña de la base (la misma que usa supabase db push)."; exit 1;;
          esac
          [ "$KT_REF" != "$PROD_PROJECT_REF" ] || { echo "::error::SUPABASE_PROJECT_REF apunta al proyecto de PRODUCCIÓN. Abortado."; exit 1; }
          enc=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["KT_DB_PASSWORD"], safe=""))')
          url="postgresql://postgres.${KT_REF}:${enc}@${POOLER_HOST}:5432/postgres"
          echo "::add-mask::$url"
          echo "SUPABASE_DB_URL=$url" >> "$GITHUB_ENV"
          echo "OK · cadena armada contra $POOLER_HOST"

      - name: Instalar psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null

      # Separa "no conecta" de "el SQL falló". Sin esto, un error de conexion
      # (contraseña sin percent-encodear, cadena de Direct connection en vez de
      # Session pooler, proyecto pausado) se veia igual que un error de SQL.
      - name: Probar conexión
        run: |
          if ! out=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At \
                       -c "select 'conexion ok - db=' || current_database() || ' - user=' || current_user" 2>&1); then
            echo "::group::Salida de psql"
            echo "$out"
            echo "::endgroup::"
            echo "::error::No se pudo conectar con SUPABASE_DB_URL. Revisa: (a) que sea la cadena del *Session pooler* y no la de Direct connection (esa es solo IPv6 y los runners son IPv4), (b) que [YOUR-PASSWORD] este sustituido, y (c) que los caracteres especiales de la contraseña esten percent-encodeados."
            exit 1
          fi
          echo "$out"

      # Los tres archivos en UNA sesión: el preámbulo fija kt.env y la
      # contraseña como GUC de sesión (la contraseña entra como variable de
      # psql, :'pwd', así no se escribe en ningún archivo ni sale en el log);
      # seed_sandbox.sql deja kt.seed_org_id / kt.seed_staff_id para que los 6
      # pacientes caigan en la Clínica Sandbox asignados a la Dra. Clínica Sandbox.
      # Se corre DOS veces. La 2ª pasada reproduce el estado "sandbox ya usado" (con
      # un renglón de auditoría de un usuario sandbox inyectado entre pasadas), que es
      # lo que reventaba en la corrida #6 al borrar auth.users (FK audit_log.actor_id).
      # Cada pasada es ATÓMICA: --single-transaction envuelve los tres -f en UNA
      # transacción; si algo falla, NO queda rastro (antes el delete se confirmaba y el
      # reseed nunca ocurría → el entorno quedaba peor que antes).
      - name: Sembrar (dos pasadas — virgen y "ya usado")
        run: |
          set -o pipefail
          printf "%s\n" \
            "select set_config('kt.env', 'sandbox', false);" \
            "select set_config('kt.sandbox_password', :'pwd', false);" > /tmp/preambulo.sql
          run_seed() {
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -q \
                 -v pwd="$SANDBOX_USER_PASSWORD" \
                 -f /tmp/preambulo.sql \
                 -f supabase/seed/seed_sandbox.sql \
                 -f supabase/seed/seed_synthetic_patients.sql
          }
          dump() { echo "::group::Salida completa de psql"; tail -n 80 "$1"; echo "::endgroup::"; }
          # Pasada 1.
          if ! run_seed > /tmp/seed1.log 2>&1; then
            dump /tmp/seed1.log
            echo "::error::El seed falló en la 1ª pasada."
            exit 1
          fi
          echo "Pasada 1 OK."
          # Reproduce "ya usado": auditoría atribuida a un usuario sandbox. Es
          # EXACTAMENTE la fila que bloqueaba el borrado de auth.users (FK sin cascada).
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -c \
            "insert into public.audit_log(actor_id, actor_role, action, table_name, record_id)
             select id, 'admin', 'SANDBOX_SEED_TEST', 'sites', gen_random_uuid()
               from auth.users where email = 'admin@sandbox.kuratracker.mx' limit 1;"
          # Pasada 2 sobre el sandbox "usado": si el borrado no maneja las FK, revienta.
          if ! run_seed > /tmp/seed2.log 2>&1; then
            dump /tmp/seed2.log
            echo "::error::El re-seed falló en la 2ª pasada (estado 'ya usado')."
            exit 1
          fi
          echo "Pasada 2 (ya usado) OK. El seed es idempotente y atómico."

      # Verificación por IDENTIDAD, no por conteo. El sandbox ya no contiene solo lo
      # que pone ESTE seed (otros dos workflows siembran ahí, más trabajo manual), así
      # que un conteo absoluto se pone rojo por cosas ajenas y se deja de leer. Se
      # comprueba que existan, por id/correo, los centros y cuentas que este seed crea
      # con su configuración; y que los dos centros de verificación tengan module:clinico
      # y NO admin/insumos/comercial — que es lo que los hace útiles.
      - name: Verificar (por identidad)
        run: |
          set -o pipefail
          C1=a0000000-0000-4000-a000-000000000001  # Clínica Sandbox
          C2=a0000000-0000-4000-a000-000000000002  # Hospital Sandbox
          C3=a0000000-0000-4000-a000-000000000003  # Cuidadores Sandbox
          CH=a0000000-0000-4000-a000-000000000031  # Hospital Prueba (bloqueos)
          CB=a0000000-0000-4000-a000-000000000032  # Clínica Prueba (solo asientos)
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "
            select 'clinica=' || case when center_type='clinica_heridas' and is_test then 'OK' else 'FAIL' end from public.organizations where id='$C1';
            select 'hospital=' || case when center_type='hospital' and is_test then 'OK' else 'FAIL' end from public.organizations where id='$C2';
            select 'cuidadores=' || case when center_type='cuidadores' and is_test then 'OK' else 'FAIL' end from public.organizations where id='$C3';
            select 'hosp_test=' || case when center_type='hospital' and is_test then 'OK' else 'FAIL' end from public.organizations where id='$CH';
            select 'basica_test=' || case when center_type='clinica_heridas' and is_test then 'OK' else 'FAIL' end from public.organizations where id='$CB';
            select 'cuentas=' || case when count(*)=9 then 'OK' else 'FAIL (' || count(*) || ')' end from auth.users where email in (
              'master@sandbox.kuratracker.mx','admin@sandbox.kuratracker.mx','clinico@sandbox.kuratracker.mx',
              'independiente@sandbox.kuratracker.mx','admin.hospital@sandbox.kuratracker.mx','enfermeria@sandbox.kuratracker.mx',
              '5550001234@cuidador.kuramas.com','admin.hospital.test@sandbox.kuratracker.mx','admin.basica.test@sandbox.kuratracker.mx');
            select 'hosp_test_clinico=' || case when exists(select 1 from public.org_entitlements where organization_id='$CH' and kind='module' and key='clinico' and status='active') then 'OK' else 'FAIL' end;
            select 'hosp_test_seat=' || case when exists(select 1 from public.org_entitlements where organization_id='$CH' and kind='seat' and key='clinico' and status='active') then 'OK' else 'FAIL' end;
            select 'hosp_test_nopaid=' || case when not exists(select 1 from public.org_entitlements where organization_id='$CH' and kind='module' and key in ('admin','insumos','comercial') and status='active') then 'OK' else 'FAIL' end;
            select 'basica_test_clinico=' || case when exists(select 1 from public.org_entitlements where organization_id='$CB' and kind='module' and key='clinico' and status='active') then 'OK' else 'FAIL' end;
            select 'basica_test_seat=' || case when exists(select 1 from public.org_entitlements where organization_id='$CB' and kind='seat' and key='clinico' and status='active') then 'OK' else 'FAIL' end;
            select 'basica_test_nopaid=' || case when not exists(select 1 from public.org_entitlements where organization_id='$CB' and kind='module' and key in ('admin','insumos','comercial') and status='active') then 'OK' else 'FAIL' end;
            select 'clinica_pacientes=' || case when count(*) > 0 then 'OK' else 'FAIL' end from public.patients where organization_id='$C1';
          " | tee /tmp/verify.txt
          for chk in clinica hospital cuidadores hosp_test basica_test cuentas \
                     hosp_test_clinico hosp_test_seat hosp_test_nopaid \
                     basica_test_clinico basica_test_seat basica_test_nopaid \
                     clinica_pacientes; do
            grep -q "^${chk}=OK$" /tmp/verify.txt || { echo "::error::verificación falló o faltó: ${chk} (ver salida arriba)"; exit 1; }
          done
          echo "Sandbox verificado por identidad. Cuentas: ver cabecera de supabase/seed/seed_sandbox.sql"
