# Configuración de `flutter test` / `dart test`.
#
# Declara las etiquetas de test usadas en el repo (evita el aviso "undefined
# tag"). NO excluye nada aquí: en LOCAL todo corre, incluidos los rojos
# conocidos — son nuestra única señal del defecto. La exclusión de
# 'known-fail-overseg' se aplica SOLO en CI, con --exclude-tags en el job
# `checks` de .github/workflows/deploy.yml, para que un defecto conocido y
# documentado no bloquee el despliegue de todo lo demás.
tags:
  # Sobre-etiquetado del clasificador de visión (Etapa B) en heridas alargadas
  # recortadas (70×16 @ 90°). Diagnóstico: rama fix/vision-classifier-overseg.
  # Se retira esta etiqueta (y su exclusión en CI) cuando se arregle el clasificador.
  known-fail-overseg:
